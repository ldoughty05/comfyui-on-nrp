# kubectl apply -f model-loader-pod.yaml
# kubectl exec -it model-loader -n carson-center -- /bin/bash

apiVersion: v1
kind: Pod
metadata:
  name: model-loader
  namespace: carson-center
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: nvidia.com/gpu.product
            operator: In
            values:
            - NVIDIA-A10
            - NVIDIA-GeForce-RTX-3090
            - NVIDIA-GeForce-RTX-4090
            - NVIDIA-L40
  containers:
  - name: loader
    image: python:3.11
    command: ["sleep", "infinity"]
    volumeMounts:
    - name: common-comfyui-models-central
      mountPath: /models
    - name: shared-comfyui-models-central
      mountPath: /models-central
  volumes:
  - name: common-comfyui-models-central
    persistentVolumeClaim:
      claimName: common-comfyui-models-central
  - name: shared-comfyui-models-central
    persistentVolumeClaim:
      claimName: shared-comfyui-models-central
  restartPolicy: Never